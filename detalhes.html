<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto | AURA STREET</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">AURA <span>STREET</span></a>
        <nav>
            <ul>
                <li><a href="index.html">← Voltar à Loja</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <button class="cart-icon-btn" onclick="toggleCart(true)">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <main class="catalog-container" id="detalhesContent" style="margin-top: 40px;">
        <div class="details-wrapper">
            
            <!-- GALERIA DE FOTOS COM ROTAÇÃO AUTOMÁTICA -->
            <div class="gallery-container">
                <div class="main-image-box">
                    <img id="mainProductImg" src="" alt="Produto">
                </div>
                <p style="font-size:0.75rem; color:var(--text-muted); text-align:center;"><i class="fa-solid fa-arrows-rotate"></i> Fotos alternam a cada 5 segundos ou clique nas miniaturas abaixo:</p>
                <div class="thumbnails-row" id="thumbnailsContainer">
                    <!-- Miniaturas geradas via JS -->
                </div>
            </div>

            <!-- INFORMAÇÕES DO PRODUTO -->
            <div class="details-info-box">
                <span id="detalhesCategoria" class="product-category" style="font-size: 0.9rem;"></span>
                <h1 id="detalhesTitulo" style="font-size: 2.2rem; margin: 10px 0;"></h1>
                
                <div class="product-price" style="margin-bottom: 20px;">
                    <span id="detalhesPreco" class="price-current" style="font-size: 1.8rem;"></span>
                    <span id="detalhesPrecoAntigo" class="price-old" style="font-size: 1.2rem;"></span>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="font-weight: 600; color: var(--text-muted); display: block;">Selecione o Tamanho:</label>
                    <div class="size-selector" id="sizeSelectorContainer">
                        <!-- Botões de tamanho -->
                    </div>
                </div>

                <button class="btn-primary" style="width: 100%; margin-bottom: 30px;" onclick="addCurrentProductToCart()">
                    <i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho
                </button>

                <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <h3 style="font-size: 1.1rem; color: var(--accent-gold); margin-bottom: 10px;">Descrição do Produto</h3>
                    <p id="detalhesDescricao" style="color: var(--text-muted); line-height: 1.8;"></p>
                </div>
            </div>

        </div>
    </main>

    <!-- DRAWER CARRINHO -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Seu Carrinho</h3>
            <button class="close-cart" onclick="toggleCart(false)">&times;</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">R$ 0.00</span>
            </div>
            <button class="btn-wpp-checkout" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Finalizar no WhatsApp
            </button>
        </div>
    </div>

    <!-- BOTÃO WHATSAPP FLOAT -->
    <a href="https://wa.me/5511999999999" class="wpp-float" target="_blank" title="Dúvidas no WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 AURA STREET. Todos os direitos reservados. Desenvolvido por <strong>Riolly</strong>.</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/detalhes.js"></script>
</body>
</html>
